<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH 更新</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent !important;
        color-scheme: none !important;
      }
    </style>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="toast-page">
    <section id="toast" class="toast-card" aria-live="polite">
      <div class="toast-mark">DS</div>
      <div class="toast-body">
        <div class="toast-head">
          <p id="title" class="toast-title">DSH 更新</p>
          <span id="meta" class="toast-meta"></span>
        </div>
        <ol id="steps" class="toast-track"></ol>
        <p id="message" class="toast-message">正在准备。</p>
        <div class="toast-bar" id="bar">
          <span id="fill" class="toast-bar-fill"></span>
        </div>
      </div>
    </section>
    <script src="./toast.js"></script>
  </body>
</html>
