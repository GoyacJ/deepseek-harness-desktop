[package]
name = "deepseek-harness-desktop"
version = "0.1.5"
description = "Tauri desktop shell for the official DeepSeek Harness npm distribution"
authors = ["Goya"]
edition = "2024"
license = "MIT"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ctrlc = { version = "3.5.0", features = ["termination"] }
libc = "0.2.180"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2"
