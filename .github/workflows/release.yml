name: Release desktop apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'release:')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            runtimeTarget: linux-x64
            bundles: deb,appimage
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            runtimeTarget: win32-x64
            bundles: msi,nsis
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            runtimeTarget: darwin-arm64
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-15
            target: x86_64-apple-darwin
            runtimeTarget: darwin-x64
            bundles: app,dmg

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - name: Prepare AppImage bundler tools
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tools="$HOME/.cache/tauri"
          mkdir -p "$tools"
          gh release download apprun-old \
            --repo tauri-apps/binary-releases \
            --pattern AppRun-x86_64 \
            --output "$tools/AppRun-x86_64"
          gh release download linuxdeploy \
            --repo tauri-apps/binary-releases \
            --pattern linuxdeploy-x86_64.AppImage \
            --output "$tools/linuxdeploy-x86_64.AppImage"
          gh api "repos/tauri-apps/linuxdeploy-plugin-gtk/contents/linuxdeploy-plugin-gtk.sh?ref=master" \
            --header "Accept: application/vnd.github.raw+json" \
            > "$tools/linuxdeploy-plugin-gtk.sh"
          gh api "repos/tauri-apps/linuxdeploy-plugin-gstreamer/contents/linuxdeploy-plugin-gstreamer.sh?ref=master" \
            --header "Accept: application/vnd.github.raw+json" \
            > "$tools/linuxdeploy-plugin-gstreamer.sh"
          gh release download continuous \
            --repo linuxdeploy/linuxdeploy-plugin-appimage \
            --pattern linuxdeploy-plugin-appimage-x86_64.AppImage \
            --output "$tools/linuxdeploy-plugin-appimage.AppImage"
          chmod +x "$tools"/*

      - name: Install desktop dependencies
        run: npm ci

      - name: Prepare official DSH runtime
        run: npm run prepare:runtime
        env:
          DSH_DESKTOP_RUNTIME_TARGET: ${{ matrix.runtimeTarget }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          tagName: v__VERSION__
          releaseName: dsh-dk v__VERSION__
          releaseBody: |
            桌面预览版本。安装包已内置 Node.js 22.23.2 和官方 @deepseek-ai/dsh@0.1.0-rc.6。

            macOS 安装包未做 Apple Developer ID 签名。Windows 安装包未做代码签名。
            已包含应用内桌面更新产物。已安装本版本的用户可从应用菜单检查后续桌面更新。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
          updaterJsonPreferNsis: true
          retryAttempts: 1
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch]_[bundle][ext]"
          args: --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
